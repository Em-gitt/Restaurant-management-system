spring.application.name=menu-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_MENU_URL:jdbc:postgresql://localhost:5432/menudb}
spring.datasource.username=${DB_MENU_USERNAME:menu_user}
spring.datasource.password=${DB_MENU_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}