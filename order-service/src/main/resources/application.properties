spring.application.name=order-service

server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_ORDER_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_ORDER_USERNAME:order_user}
spring.datasource.password=${DB_ORDER_PASSWORD:order_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}

services.menu.url=${MENU_SERVICE_URL:http://localhost:8083}
services.table.url=${TABLE_SERVICE_URL:http://localhost:8082}
services.kitchen.url=${KITCHEN_SERVICE_URL:http://localhost:8087}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8085}
services.employee.url=${EMPLOYEE_SERVICE_URL:http://localhost:8084}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8088}
services.report.url=${REPORT_SERVICE_URL:http://localhost:8090}
services.delivery.url=${DELIVERY_SERVICE_URL:http://localhost:8089}
