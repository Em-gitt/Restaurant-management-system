spring.application.name=delivery-service

server.port=${SERVER_PORT:8089}

spring.datasource.url=${DB_DELIVERY_URL:jdbc:postgresql://localhost:5432/deliverydb}
spring.datasource.username=${DB_DELIVERY_USERNAME:delivery_user}
spring.datasource.password=${DB_DELIVERY_PASSWORD:delivery_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}

delivery.webhook.secret=${DELIVERY_WEBHOOK_SECRET:secret-delivery-webhook-key-restaurant}

services.order.url=${ORDER_SERVICE_URL:http://localhost:8086}
