spring.application.name=payment-service

server.port=${SERVER_PORT:8088}

spring.datasource.url=${DB_PAYMENT_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${DB_PAYMENT_USERNAME:payment_user}
spring.datasource.password=${DB_PAYMENT_PASSWORD:payment_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}

services.order.url=${ORDER_SERVICE_URL:http://localhost:8086}
