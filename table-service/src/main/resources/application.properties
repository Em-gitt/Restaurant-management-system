spring.application.name=table-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_TABLE_URL:jdbc:postgresql://localhost:5432/tabledb}
spring.datasource.username=${DB_TABLE_USERNAME:table_user}
spring.datasource.password=${DB_TABLE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}
