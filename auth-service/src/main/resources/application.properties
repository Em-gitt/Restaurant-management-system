spring.application.name=auth
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_AUTH_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${DB_AUTH_USERNAME:auth_user}
spring.datasource.password=${DB_AUTH_PASSWORD:auth_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:default_jwt_secret_key_restaurant_system_must_be_overridden_in_prod_at_least_256_bits}
jwt.expiration=${JWT_EXPIRATION:3600000}